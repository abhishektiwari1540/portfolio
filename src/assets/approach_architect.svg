<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#090b12; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#101524" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="300" fill="#00dcff" opacity="0.12" filter="url(#glow)" />
  <circle cx="900" cy="600" r="300" fill="#00dcff" opacity="0.08" filter="url(#glow)" />

  <!-- Top Badge -->
  <rect x="60" y="50" width="1080" height="50" rx="12" fill="rgba(20,24,40,0.8)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="90" cy="75" r="6" fill="#ff5f56" />
  <circle cx="112" cy="75" r="6" fill="#ffbd2e" />
  <circle cx="134" cy="75" r="6" fill="#27c93f" />
  <text x="165" y="81" fill="#00dcff" font-size="14" font-weight="800" letter-spacing="2">01 // ARCHITECT &amp; DATA SYSTEM SCHEMA</text>
  <rect x="950" y="63" width="160" height="24" rx="12" fill="#00dcff" opacity="0.2" />
  <text x="1030" y="79" fill="#00dcff" font-size="11" font-weight="800" text-anchor="middle">MODELED &amp; TYPED</text>

  <!-- Database ERD Diagram Cards -->
  <!-- Table 1: USERS -->
  <rect x="80" y="150" width="310" height="420" rx="16" fill="rgba(16,20,34,0.9)" stroke="#00dcff" stroke-width="2" filter="url(#glow)" />
  <rect x="80" y="150" width="310" height="50" rx="16" fill="#00dcff" opacity="0.2" />
  <text x="105" y="182" fill="#ffffff" font-size="16" font-weight="800">TBL_USERS (MYSQL)</text>
  
    <rect x="100" y="220" width="270" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="120" y="245" fill="#00dcff" font-size="13" font-weight="800">id (UUID PK)</text>
  
    <rect x="100" y="272" width="270" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="120" y="297" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">email (VARCHAR)</text>
  
    <rect x="100" y="324" width="270" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="120" y="349" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">password_hash</text>
  
    <rect x="100" y="376" width="270" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="120" y="401" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">role_enum (RBAC)</text>
  
    <rect x="100" y="428" width="270" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="120" y="453" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">created_at (TIMESTAMP)</text>
  
    <rect x="100" y="480" width="270" height="40" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="120" y="505" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">updated_at (TIMESTAMP)</text>
  

  <!-- Connecting Relationship Line 1 -> 2 -->
  <path d="M 390 240 Q 450 240 510 300" fill="none" stroke="#00dcff" stroke-width="3" stroke-dasharray="8 6" filter="url(#glow)" />

  <!-- Table 2: ORDERS / BOOKINGS -->
  <rect x="510" y="200" width="320" height="480" rx="16" fill="rgba(16,20,34,0.9)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <rect x="510" y="200" width="320" height="50" rx="16" fill="rgba(255,255,255,0.08)" />
  <text x="535" y="232" fill="#ffffff" font-size="16" font-weight="800">TBL_BOOKINGS &amp; SEATS</text>
  
    <rect x="530" y="270" width="280" height="38" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="550" y="294" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">id (UUID PK)</text>
  
    <rect x="530" y="320" width="280" height="38" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="550" y="344" fill="#00dcff" font-size="13" font-weight="800">user_id (FK -> USERS)</text>
  
    <rect x="530" y="370" width="280" height="38" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="550" y="394" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">court_slot_id (FK)</text>
  
    <rect x="530" y="420" width="280" height="38" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="550" y="444" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">payment_status (ENUM)</text>
  
    <rect x="530" y="470" width="280" height="38" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="550" y="494" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">websocket_token</text>
  
    <rect x="530" y="520" width="280" height="38" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="550" y="544" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">total_amount (DECIMAL)</text>
  
    <rect x="530" y="570" width="280" height="38" rx="8" fill="rgba(255,255,255,0.03)" />
    <text x="550" y="594" fill="rgba(255,255,255,0.8)" font-size="13" font-weight="500">expires_at (TIMESTAMP)</text>
  

  <!-- Table 3: TELEMETRY LOGS -->
  <rect x="870" y="150" width="270" height="530" rx="16" fill="rgba(16,20,34,0.9)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <rect x="870" y="150" width="270" height="50" rx="16" fill="rgba(255,255,255,0.08)" />
  <text x="895" y="182" fill="#ffffff" font-size="16" font-weight="800">REDIS &amp; CACHE</text>
  <rect x="890" y="220" width="230" height="90" rx="10" fill="rgba(0,220,255,0.1)" stroke="#00dcff" stroke-width="1" />
  <text x="905" y="250" fill="#00dcff" font-size="12" font-weight="800">REDIS IN-MEMORY</text>
  <text x="905" y="280" fill="#ffffff" font-size="20" font-weight="900">12ms Latency</text>

  <!-- Bottom Architecture Metrics -->
  <rect x="80" y="600" width="750" height="80" rx="14" fill="rgba(16,20,34,0.9)" stroke="rgba(255,255,255,0.1)" />
  <text x="110" y="646" fill="#00dcff" font-size="22" font-weight="900">ZERO DATA LOSS</text>
  <text x="360" y="646" fill="rgba(255,255,255,0.7)" font-size="14">Strict FK constraints &amp; transactional boundaries</text>
</svg>